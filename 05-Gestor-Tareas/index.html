<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Tareas</title>
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <main>
      <div class="tarjeta-tareas">
        <h1>Mis Tareas Pendientes</h1>

        <section class="input-tareas">
          <input
            type="text"
            name="tarea_hacer"
            id="tarea_hacer"
            placeholder="¿Qué necesitas hacer hoy?"
          />
          <button type="button" class="btn-primario">Agregar Tarea</button>
        </section>

        <section class="lista-tareas">
          <ul>
            <li class="item-tarea">
              <label>
                <input type="checkbox" name="tarea_uno" />
                <span>Estudiar etiquetas semánticas</span>
              </label>
              <button class="btn-borrar">✖</button>
            </li>

            <li class="item-tarea completada">
              <label>
                <input type="checkbox" name="tarea_dos" checked />
                <span>Tomar 2 litros de agua</span>
              </label>
              <button class="btn-borrar">✖</button>
            </li>

            <li class="item-tarea">
              <label>
                <input type="checkbox" name="tarea_tres" />
                <span>Avanzar en el proyecto de GitHub</span>
              </label>
              <button class="btn-borrar">✖</button>
            </li>
          </ul>

          <div class="footer-tareas">
            <p class="contador">Tienes <strong>2</strong> tareas pendientes.</p>
            <button class="btn-limpiar">Limpiar Completadas</button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
