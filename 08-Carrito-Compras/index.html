<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda Appwise</title>
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <header>
      <h1>Appwise Store</h1>
      <button>🛒 Ver Carrito (2)</button>
    </header>
    <main>
      <h2>Nuestros Productos</h2>
      <div class="section-article">
        <section>
          <article class="card">
            <div class="card-image">
              <img src="./assets/auricular_gamer.webp" />
            </div>
            <h3>Auriculares Inalmbricos</h3>
            <p><strong>$49.99</strong></p>
            <button>Añadir al carrito</button>
          </article>
          <article class="card">
            <div class="card-image">
              <img src="./assets/teclado_mecanico.webp" />
            </div>

            <h3>Teclado mecanico</h3>
            <p><strong>$99.99</strong></p>
            <button>Añadir al carrito</button>
          </article>
          <article class="card">
            <div class="card-image">
              <img src="./assets/mouse_gamer.webp" />
            </div>
            <h3>Mouse Gamer RGB</h3>
            <p><strong>$29.99</strong></p>
            <button>Añadir al carrito</button>
          </article>
        </section>
        <aside>
          <h3>Resumen de Compra</h3>
          <ul>
            <li>
              <p>Teclado Mecánico</p>
              <p><strong>$99.99</strong></p>
              <button>❌</button>
            </li>
            <li>
              <p>Auriculares Inalmbricos</p>
              <p><strong>$49.99</strong></p>
              <button>❌</button>
            </li>
          </ul>
          <hr />
          <h3><strong>Total: $149.98</strong></h3>
          <button>Finalizar Compra</button>
        </aside>
      </div>
    </main>
  </body>
</html>
